[package]
name = "rupor"
version = "0.6.1"
description = "Рупор — голосовая диктовка для Windows (оболочка Tauri)"
authors = ["listapad2024"]
license = "MIT"
repository = "https://github.com/listapad2024/rupor"
homepage = "https://github.com/listapad2024/rupor"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "rupor_lib"
path = "src/lib.rs"

[[bin]]
name = "rupor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
# build.rs сверяет версии в tauri.conf.json и ui/package.json
serde_json = "1"

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
# Выбор папки моделей Whisper («Обзор…» в настройках и мастере). ~2.7 — последняя ветка
# под tauri 2.11: 2.8 требует tauri 2.12, а с ним и @tauri-apps/api 2.12 (версии оболочки и
# JS API у Tauri должны совпадать до минорной). В ui/package.json — тоже ~2.7.
tauri-plugin-dialog = "~2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Приложение только для Windows: Win32 API для пилюли, трея, UAC, job object ядра и языка
# интерфейса Windows (GetUserDefaultUILanguage).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Пилюля: подписка на падение процессов её WebView2 (ProcessFailed) — та же версия, что у wry
webview2-com = "0.38"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
