[project]
name = "rupor"
version = "0.4.3"
description = "Рупор — локальная голосовая диктовка для Windows (ядро)"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "listapad2024" }]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "pystray>=0.19",
    "pillow>=10",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "websockets>=13",
    "comtypes>=1.4",   # UI Automation: обучение словаря на правках (rupor.uia)
    # 2.x перешёл с httpx на httpx2 (без certifi): fetch._hf_client_factory строит httpx.Client
    "huggingface_hub>=0.21,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "pyinstaller>=6.10"]

[project.urls]
Homepage = "https://github.com/listapad2024/rupor"
Repository = "https://github.com/listapad2024/rupor"
Issues = "https://github.com/listapad2024/rupor/issues"

[build-system]
# license = "MIT" (SPDX-выражение, PEP 639) и license-files понимает setuptools ≥ 77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
# частотные списки личного словаря частот (rupor.vocab), каталоги сообщений ru/en (rupor.i18n)
rupor = ["data/*.txt", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "core"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "sounddevice.*", "pystray.*", "ctranslate2.*", "comtypes.*",
          "huggingface_hub.*", "PyInstaller.*"]
ignore_missing_imports = true
