name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Ядро (pytest, mypy)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Зависимости из pyproject.toml, кроме nvidia-cublas/cudnn (больше гигабайта CUDA):
      # на раннере нет видеокарты, распознавание в тестах подменено.
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper>=1.1" "sounddevice>=0.5" "numpy>=1.26" "pystray>=0.19" "pillow>=10" "websockets>=13" "comtypes>=1.4" "huggingface_hub>=0.21,<2" "pytest>=8" "mypy>=1.10"
          python -m pip install --no-deps -e .

      - name: mypy
        run: python -m mypy core/rupor

      - name: pytest
        run: python -m pytest -ra

  ui:
    name: Интерфейс (tsc, i18n, сборка)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check:i18n
      - run: npm run build
